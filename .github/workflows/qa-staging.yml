# Daily scheduled QA run + manual workflow_dispatch trigger.
#
# Architecture: this workflow is the issue-management layer for the runner.
# The runner container only writes report.md/json into the shared volume;
# this workflow reads the report from the static endpoint after the run
# completes and uses the auto-scoped GITHUB_TOKEN (issues:write) to open,
# update, and close issues for each FAIL — no PAT lives in the container.
#
# Trigger mechanism (rewritten 2026-08-27): the runner is a Docker Swarm
# ONESHOT (restart-condition=none). The old trigger POSTed to Dokploy's
# application.deploy API and then trusted Dokploy's applicationStatus field,
# which flips to "error" ~50% of runs because Dokploy mishandles a
# restart-condition=none container that is SUPPOSED to exit — the poll then
# exit-1'd on that single reading before ever fetching the report, so
# latest.json silently went stale for days. We now force-run the oneshot
# directly with `docker service update --force` on the swarm manager (the
# proven-reliable path) and treat a NEW run_id in latest.json — not Dokploy's
# status — as the completion signal.
name: qa-staging

on:
  schedule:
    - cron: '7 7 * * *' # 2 AM ET — avoid the :00 hot-zone
  workflow_dispatch:
    inputs:
      slice:
        description: "Tag filter to run (p0, p1, smoke, etc). Empty = full suite."
        required: false
        default: ""

permissions:
  contents: read
  issues: write
  packages: read

jobs:
  run-suite:
    # Runs on the vps2 self-hosted runner, which is the swarm LEADER and whose
    # gha-runner user is in the docker group — so `docker service update` works
    # as a plain local command (no SSH, no Dokploy). The `vps2` label pins it to
    # that manager node; the assert-manager step fails loud if it ever doesn't.
    runs-on: [self-hosted, vps2]
    outputs:
      prev_run_id: ${{ steps.prev.outputs.run_id }}
    steps:
      - name: Assert this runner is on a swarm manager
        run: |
          if ! docker node ls >/dev/null 2>&1; then
            echo "::error::Job did not land on a swarm manager (docker node ls failed). The 'vps2' runner must be the swarm Leader. Aborting rather than silently no-op."
            exit 1
          fi

      - name: Log in to ghcr.io (so --with-registry-auth can pull :latest)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Capture current report run_id (baseline)
        id: prev
        run: |
          prev=$(curl -fsSLk --retry 3 https://qa-reports.test.revhero.io/latest.json | jq -r '.summary.run_id // ""')
          echo "run_id=$prev" >> "$GITHUB_OUTPUT"
          echo "baseline run_id before force-run: $prev"

      - name: Force-run the QA oneshot (docker service update, retry 3x)
        run: |
          for attempt in 1 2 3; do
            if docker service update --with-registry-auth --force automated-qa-runner-staging-3kteos; then
              echo "force-run dispatched on attempt $attempt"
              exit 0
            fi
            echo "attempt $attempt failed; retrying in 20s"
            sleep 20
          done
          echo "::error::docker service update failed 3x — could not start the QA runner oneshot"
          exit 1

  report:
    needs: run-suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for a NEW report run_id (not Dokploy status)
        env:
          PREV_RUN_ID: ${{ needs.run-suite.outputs.prev_run_id }}
        run: |
          echo "waiting for a run_id newer than: '${PREV_RUN_ID}'"
          deadline=$(( $(date +%s) + 1800 )) # 30 min
          cur="${PREV_RUN_ID}"
          while [[ $(date +%s) -lt $deadline ]]; do
            cur=$(curl -fsSLk https://qa-reports.test.revhero.io/latest.json | jq -r '.summary.run_id // ""')
            if [[ -n "$cur" && "$cur" != "${PREV_RUN_ID}" ]]; then
              echo "fresh report published: $cur"
              break
            fi
            sleep 15
          done
          if [[ -z "$cur" || "$cur" == "${PREV_RUN_ID}" ]]; then
            echo "::error::No fresh QA report after 30min (still '${PREV_RUN_ID}'). The oneshot did not publish — check the runner service on the swarm."
            exit 1
          fi

      - name: Fetch latest QA report
        run: |
          # Allow a few seconds for nginx to see the new files.
          sleep 10
          curl -fsSLk https://qa-reports.test.revhero.io/latest.json -o /tmp/latest.json
          jq '.summary | {run_id, finished_at, total, passed, failed, skipped, not_exec}' /tmp/latest.json

      - name: Sync GitHub Issues for failed tests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: bash scripts/sync-qa-issues.sh /tmp/latest.json registry.json

      - name: Fail the workflow on CRITICAL failures
        run: |
          set -euo pipefail
          critical_fails=$(jq -r '
            [.summary.results[] | select(.status == "FAIL") | .id] as $failed
            | input.entries
            | map(select(.id as $i | $failed | index($i)))
            | map(select(.severity == "critical"))
            | length
          ' /tmp/latest.json registry.json)
          echo "CRITICAL fail count: $critical_fails"
          if [[ "$critical_fails" -gt 0 ]]; then
            echo "::error::$critical_fails CRITICAL test(s) failing"
            exit 1
          fi
