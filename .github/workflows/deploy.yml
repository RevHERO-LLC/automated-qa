# Build + push the QA runner + reporter-static images to GHCR, then ask
# Dokploy to redeploy. Mirrors the deployment pattern used by the 13 service
# repos (ghcr.io/revhero-llc/...).
name: deploy

on:
  push:
    branches: [main]
    paths:
      - 'runner/**'
      - 'shared/**'
      - 'reporter-static/**'
      - 'trigger/**'
      - 'registry.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  RUNNER_IMAGE: revhero-llc/revhero-automated-qa-runner
  STATIC_IMAGE: revhero-llc/revhero-automated-qa-static
  TRIGGER_IMAGE: revhero-llc/revhero-automated-qa-trigger

jobs:
  build-runner:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push runner image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: runner/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.RUNNER_IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.RUNNER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-static:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push static image
        uses: docker/build-push-action@v6
        with:
          context: reporter-static
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.STATIC_IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.STATIC_IMAGE }}:${{ github.sha }}

  build-trigger:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push trigger image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: trigger/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.TRIGGER_IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.TRIGGER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  redeploy:
    runs-on: ubuntu-latest
    needs: [build-runner, build-static, build-trigger]
    permissions:
      contents: read
      packages: read
    steps:
      # The pullable-wait below inspects private GHCR images, so this job needs its own login.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Pin each app to THIS commit's immutable image tag before redeploying.
      # Why: the apps run the FLOATING ":latest" tag. Swarm compares the image
      # STRING on service update -- an unchanged string means no spec change, so it
      # restarts the task on the image it already has cached and never pulls the new
      # build. Observed 2026-10-02: after #1349 the runner restarted on the OLD image
      # (local digest 619e06e4, not the new 926509ea), so the 429 fix never ran.
      # Same class as the fleet deploy fix (#56). The pullable-wait guards the GHCR
      # "digest not found" race right after a push.
      - name: Wait until the runner image is pullable
        run: |
          set -uo pipefail
          IMAGE="${{ env.REGISTRY }}/${{ env.RUNNER_IMAGE }}:${{ github.sha }}"
          for i in $(seq 1 36); do
            if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then echo "pullable: $IMAGE"; exit 0; fi
            echo "not pullable yet (attempt $i/36); retrying in 5s"; sleep 5
          done
          echo "::error::$IMAGE was still not pullable after 180s"; exit 1
      - name: Pin runner image to this commit
        env:
          DOKPLOY_API_TOKEN: ${{ secrets.DOKPLOY_API_TOKEN }}
        run: |
          curl -fsSL -X POST \
            -H "X-API-Key: ${DOKPLOY_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "http://147.93.1.174:3000/api/application.update" \
            -d '{"applicationId":"${{ vars.QA_RUNNER_APP_ID }}","dockerImage":"${{ env.REGISTRY }}/${{ env.RUNNER_IMAGE }}:${{ github.sha }}"}'
      - name: Trigger Dokploy redeploy (runner)
        env:
          DOKPLOY_API_TOKEN: ${{ secrets.DOKPLOY_API_TOKEN }}
        run: |
          curl -fsSL -X POST \
            -H "X-API-Key: ${DOKPLOY_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "http://147.93.1.174:3000/api/application.deploy" \
            -d '{"applicationId":"${{ vars.QA_RUNNER_APP_ID }}"}'
      - name: Wait until the static image is pullable
        run: |
          set -uo pipefail
          IMAGE="${{ env.REGISTRY }}/${{ env.STATIC_IMAGE }}:${{ github.sha }}"
          for i in $(seq 1 36); do
            if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then echo "pullable: $IMAGE"; exit 0; fi
            echo "not pullable yet (attempt $i/36); retrying in 5s"; sleep 5
          done
          echo "::error::$IMAGE was still not pullable after 180s"; exit 1
      - name: Pin static image to this commit
        env:
          DOKPLOY_API_TOKEN: ${{ secrets.DOKPLOY_API_TOKEN }}
        run: |
          curl -fsSL -X POST \
            -H "X-API-Key: ${DOKPLOY_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "http://147.93.1.174:3000/api/application.update" \
            -d '{"applicationId":"${{ vars.QA_STATIC_APP_ID }}","dockerImage":"${{ env.REGISTRY }}/${{ env.STATIC_IMAGE }}:${{ github.sha }}"}'
      - name: Trigger Dokploy redeploy (static)
        env:
          DOKPLOY_API_TOKEN: ${{ secrets.DOKPLOY_API_TOKEN }}
        run: |
          curl -fsSL -X POST \
            -H "X-API-Key: ${DOKPLOY_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "http://147.93.1.174:3000/api/application.deploy" \
            -d '{"applicationId":"${{ vars.QA_STATIC_APP_ID }}"}'
      - name: Wait until the trigger image is pullable
        if: vars.QA_TRIGGER_APP_ID != ''
        run: |
          set -uo pipefail
          IMAGE="${{ env.REGISTRY }}/${{ env.TRIGGER_IMAGE }}:${{ github.sha }}"
          for i in $(seq 1 36); do
            if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then echo "pullable: $IMAGE"; exit 0; fi
            echo "not pullable yet (attempt $i/36); retrying in 5s"; sleep 5
          done
          echo "::error::$IMAGE was still not pullable after 180s"; exit 1
      - name: Pin trigger image to this commit
        if: vars.QA_TRIGGER_APP_ID != ''
        env:
          DOKPLOY_API_TOKEN: ${{ secrets.DOKPLOY_API_TOKEN }}
        run: |
          curl -fsSL -X POST \
            -H "X-API-Key: ${DOKPLOY_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "http://147.93.1.174:3000/api/application.update" \
            -d '{"applicationId":"${{ vars.QA_TRIGGER_APP_ID }}","dockerImage":"${{ env.REGISTRY }}/${{ env.TRIGGER_IMAGE }}:${{ github.sha }}"}'
      - name: Trigger Dokploy redeploy (trigger)
        if: vars.QA_TRIGGER_APP_ID != ''
        env:
          DOKPLOY_API_TOKEN: ${{ secrets.DOKPLOY_API_TOKEN }}
        run: |
          curl -fsSL -X POST \
            -H "X-API-Key: ${DOKPLOY_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "http://147.93.1.174:3000/api/application.deploy" \
            -d '{"applicationId":"${{ vars.QA_TRIGGER_APP_ID }}"}'
