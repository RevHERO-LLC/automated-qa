# Daily staging↔prod divergence detector (fleet-wide).
#
# Catches the prod-only-hotfix-never-back-merged pattern that forced the
# 2026-09-08 fleet reconcile (staging silently missing live prod fixes #118
# atomic-credit, #170/#171 stage-reorder). Doctrine: staging→main promotions are
# REAL MERGE commits, never squash/cherry-pick, so main carries NO content staging
# lacks. See memory feedback_hotfix_promotion_merge_not_squash.
#
# SIGNAL (per repo): GENUINE prod-only changes, measured against the merge-base —
# lines MAIN changed since `git merge-base origin/main origin/staging` that staging's
# tip does not contain (see genuine_main_only below). Two earlier signals both
# false-alarmed:
#   * the API three-dot `compare/staging...main` counted parallel-SHA content (the
#     same fix on both branches under different commit ids) as "main-only" —
#     false-alarmed email-ingress (2026-09-09);
#   * the DIRECT two-tree diff `git diff origin/staging origin/main --numstat` is
#     merge-base-blind: when STAGING edits or deletes lines that main still holds
#     in their old form, those old lines read as "main ADDED". On 2026-10-11 it
#     alarmed 10 repos; 6 (judy, super-admin, deals-actions, dealmover-v3,
#     email-ingress, sms) were pure staging-ahead — normal unpromoted dev work.
# The merge-base signal is immune to both. If no merge-base is found within the
# deepened history it falls back to the raw tip diff and says so in the alarm.
#
# We split main-only files into REAL CODE vs CI/docs (.github/, *.md, README,
# LICENSE, .gitignore/.gitattributes). Only CODE drift Slack-alarms the deploys
# channel (a prod hotfix missing from staging — urgent). CI-only drift (a
# workflow file never back-merged) is logged in the run, not Slack-spammed.
#
# Fix for any flagged repo — a real merge, never a cherry-pick:
#   git checkout main && git merge origin/staging  (resolve) → PR → gh pr merge --merge
# then back-merge main→staging so both sides match.
name: staging-prod-drift-check

on:
  schedule:
    - cron: '17 12 * * *' # 8:17 AM ET daily — after email-drift-check (6:13) and qa-staging (2 AM)
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # FLEET_READ_TOKEN: a PAT with read access to the RevHERO-LLC repos below,
      # used to clone each and diff its tips. Least privilege = a fine-grained
      # Contents:Read PAT (no API mints fine-grained PATs — create it in the UI).
      GH_TOKEN: ${{ secrets.FLEET_READ_TOKEN }}
    steps:
      - name: Detect prod-only content missing from staging
        id: drift
        run: |
          set -uo pipefail
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "::error::FLEET_READ_TOKEN is not set on this repo (add a Contents:Read PAT)"
            exit 1
          fi

          # All deployed RevHERO-LLC services (GitHub repo names). Repos with no
          # staging branch (e.g. analytics-service) are skipped gracefully.
          REPOS="RevHero-users-service RevHero-user-fe-backend RevHero-FE-New \
            RevHERO-Super-Admin-Portal RevHero-campaign-service RevHero-deals-actions-service \
            RevHero-dealmover-v3 Revhero-Generic-Ai-Agent RevHero-cloud-documents-service \
            RevHero-Activity-service RevHero-pipedrive-v3 RevHero-hubspot-service \
            RevHero-email-ingress RevHero-sms-service RevHero-swarm-service \
            RevHero-swarm-dealmover RevHero-booking-service RevHero-optimization-service \
            RevHero-judy-service RevHero-analytics-service"

          # analytics-service was absent from this list until 2026-09-15, on the stale belief
          # that it had no staging branch — the same belief that kept it out of CLAUDE.md as
          # "not yet deployed". It has both, and it is live on prod.
          BACKLOG_MAX_DAYS="${BACKLOG_MAX_DAYS:-14}"

          # genuine_main_only <repo-dir> <merge-base>
          #   Prints "<lines>\t<file>" for every file where MAIN changed something since the
          #   merge-base that staging's tip does not have:
          #     + lines main ADDED since the merge-base that are absent from staging's copy, and
          #     - lines main REMOVED since the merge-base that staging still has (and main no
          #       longer has anywhere in the file, so a moved line is not counted).
          #   Staging-ahead edits (main untouched since the merge-base) contribute nothing; the
          #   same fix on both branches under different SHAs contributes nothing. Blank and
          #   punctuation-only lines are ignored. Validated 2026-10-12 against the 10-11 alert:
          #   flags exactly users/BFF/Generic-AI/campaign (#320, #316, #53) and none of the 6
          #   staging-ahead repos.
          _drift_norm() { sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//' | grep -vE '^[[:punct:]]*$' || true; }
          genuine_main_only() {
            local d="$1" mb="$2" f n_add n_rm tmp
            tmp=$(mktemp -d)
            while IFS= read -r f; do
              [[ -n "$f" ]] || continue
              git -C "$d" show "origin/staging:${f}" 2>/dev/null | _drift_norm > "$tmp/stg"
              git -C "$d" show "origin/main:${f}" 2>/dev/null | _drift_norm > "$tmp/main"
              git -C "$d" diff -U0 "$mb" origin/main -- "$f" > "$tmp/diff" 2>/dev/null
              grep -E '^\+' "$tmp/diff" | grep -vE '^\+\+\+ ' | cut -c2- | _drift_norm > "$tmp/add"
              grep -E '^-' "$tmp/diff" | grep -vE '^--- ' | cut -c2- | _drift_norm > "$tmp/rm"
              n_add=$(grep -vxFf "$tmp/stg" "$tmp/add" | wc -l)
              n_rm=$(grep -xFf "$tmp/stg" "$tmp/rm" | grep -vxFf "$tmp/main" | wc -l)
              if (( n_add + n_rm > 0 )); then printf '%s\t%s\n' "$(( n_add + n_rm ))" "$f"; fi
            done < <(git -C "$d" diff --name-only "$mb" origin/main 2>/dev/null)
            rm -rf "$tmp"
          }

          code_drift=0
          ci_drift=0
          backlog=0
          backlog_lines=""
          code_lines=""
          ci_lines=""
          skipped=""
          work=$(mktemp -d)

          for repo in $REPOS; do
            d="${work}/${repo}"
            if ! git clone -q --depth=1 --single-branch --branch main \
                 "https://x-access-token:${GH_TOKEN}@github.com/RevHERO-LLC/${repo}.git" "$d" 2>/tmp/e; then
              skipped="${skipped}\n  • ${repo} (no main / clone failed: $(head -c 80 /tmp/e | tr '\n' ' '))"
              continue
            fi
            if ! git -C "$d" fetch -q --depth=1 origin staging:refs/remotes/origin/staging 2>/tmp/e; then
              skipped="${skipped}\n  • ${repo} (no staging branch)"
              rm -rf "$d"; continue
            fi

            # History for the merge-base (the clone above is --depth=1). Bounded and best-effort.
            git -C "$d" fetch -q --deepen=200 origin main staging >/dev/null 2>&1 || true
            mb=$(git -C "$d" merge-base origin/main origin/staging 2>/dev/null || true)

            # Direct tip diff — still used for the staging-backlog signal below, and as the
            # main-only fallback when no merge-base is reachable.
            numstat=$(git -C "$d" diff origin/staging origin/main --numstat 2>/dev/null)
            if [[ -n "$mb" ]]; then
              genuine=$(genuine_main_only "$d" "$mb")
              mainfiles=$(echo "$genuine" | awk -F'\t' 'NF == 2 && $1 > 0 {print $2}')
              totlines=$(echo "$genuine" | awk -F'\t' 'NF == 2 {s += $1} END {print s + 0}')
              basis="since merge-base $(git -C "$d" rev-parse --short "$mb")"
            else
              mainfiles=$(echo "$numstat" | awk '$1 ~ /^[0-9]+$/ && $1 > 0 {print $3}')
              totlines=$(echo "$numstat" | awk '$1 ~ /^[0-9]+$/ {s += $1} END {print s + 0}')
              basis="NO merge-base within 200 commits: raw tip diff, may include staging-ahead noise"
            fi

            # --- UNPROMOTED STAGING BACKLOG: the direction this check never covered ---
            # Everything above answers "does prod carry content staging lacks" — a hotfix that
            # never went back. It is silent on the opposite failure: staging sitting unpromoted
            # for weeks. analytics-service diverged from main on 2026-07-22 and nobody noticed
            # for EIGHT WEEKS, because its main-only content was a single README line, correctly
            # classed CI/docs and correctly not alarmed. The check was right; it was half a check.
            #
            # Reuses the SAME tip diff rather than an API three-dot compare: numstat col2 =
            # lines DELETED going staging→main = content staging has that main lacks. A tip diff
            # is immune to the parallel-SHA false alarm documented in the header.
            #
            # Gated on how long the branches have BEEN APART (merge-base age), not on when main
            # last moved. Tested against the real analytics-service divergence: main's newest
            # commit was only 4 DAYS old — a CI-only commit (the #857 workflow removal) had
            # touched main on 2026-09-11 — while the actual code backlog was EIGHT WEEKS old.
            # A "main last moved" proxy reads that as healthy and stays silent. Merge-base age
            # measures the thing we actually care about and cannot be reset by an unrelated commit.
            #
            # Needs history, and the clone above is --depth=1, so deepen first. Bounded and
            # best-effort: if the deepen fails the repo is skipped for THIS signal rather than
            # silently reported as having no backlog.
            stagefiles=$(echo "$numstat" | awk '$2 ~ /^[0-9]+$/ && $2 > 0 {print $3}')
            stagelines=$(echo "$numstat" | awk '$2 ~ /^[0-9]+$/ {s += $2} END {print s + 0}')
            stagecode=$(echo "$stagefiles" | grep -vE '^(\.github/|README|LICENSE|\.gitignore|\.gitattributes)|\.md$' || true)
            if [[ -n "$stagecode" ]]; then
              # (history was deepened and $mb computed above)
              if [[ -z "$mb" ]]; then
                echo "backlog-indeterminate: ${repo} (no merge-base within 200 commits)"
                main_age=-1
              else
                main_age=$(( ( $(date +%s) - $(git -C "$d" log -1 --format=%ct "$mb") ) / 86400 ))
              fi
              if (( main_age >= BACKLOG_MAX_DAYS )); then
                backlog=$((backlog + 1))
                bfl=$(echo "$stagecode" | head -6 | paste -sd', ' -)
                backlog_lines="${backlog_lines}\n  • *${repo}* — ${stagelines} staging-only line(s) unpromoted; branches apart ${main_age}d; files: ${bfl}"
                echo "BACKLOG: ${repo} (${stagelines} staging-only lines, branches apart ${main_age}d)"
              fi
            fi

            if [[ -z "$mainfiles" ]]; then
              echo "ok: ${repo} (no main-only content)"
              rm -rf "$d"; continue
            fi

            # Real code = anything NOT CI/docs.
            codef=$(echo "$mainfiles" | grep -vE '^(\.github/|README|LICENSE|\.gitignore|\.gitattributes)|\.md$' || true)
            if [[ -n "$codef" ]]; then
              code_drift=$((code_drift + 1))
              flist=$(echo "$codef" | head -6 | paste -sd', ' -)
              code_lines="${code_lines}\n  • *${repo}* — ${totlines} genuine main-only line(s) (${basis}); NON-CI files: ${flist}"
              echo "CODE-DRIFT: ${repo} (${totlines} lines, ${basis}) — ${flist}"
            else
              ci_drift=$((ci_drift + 1))
              flist=$(echo "$mainfiles" | head -6 | paste -sd', ' -)
              ci_lines="${ci_lines}\n  • ${repo} — CI/docs only: ${flist}"
              echo "ci-only-drift: ${repo} — ${flist}"
            fi
            rm -rf "$d"
          done

          {
            echo "code_drift=${code_drift}"
            echo "ci_drift=${ci_drift}"
            echo "backlog=${backlog}"
          } >> "$GITHUB_OUTPUT"
          printf "%b" "$code_lines" > /tmp/code-lines.txt
          printf "%b" "$ci_lines" > /tmp/ci-lines.txt

          echo "=== code_drift=${code_drift}  ci_drift=${ci_drift} ==="
          echo "--- ci-only drift (not Slack-alarmed) ---"; printf "%b\n" "$ci_lines"
          echo "--- unpromoted staging backlog (main stale >= ${BACKLOG_MAX_DAYS}d) ---"; printf "%b\n" "$backlog_lines"
          echo "--- skipped ---"; printf "%b\n" "$skipped"

      - name: Post Slack alarm (code drift only)
        if: steps.drift.outputs.code_drift != '0'
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_DEPLOYS }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CI_DRIFT: ${{ steps.drift.outputs.ci_drift }}
        run: |
          set -euo pipefail
          if [[ -z "${SLACK_WEBHOOK}" ]]; then
            echo "::error::SLACK_WEBHOOK_DEPLOYS is not set"
            exit 1
          fi
          lines=$(cat /tmp/code-lines.txt)
          ci_note=""
          if [[ "${CI_DRIFT}" != "0" ]]; then ci_note="\n\n_(+${CI_DRIFT} repo(s) with CI/docs-only drift — see run log.)_"; fi
          headline=":rotating_light: *Staging↔prod CODE DRIFT — ${{ steps.drift.outputs.code_drift }} repo(s) have prod-only code missing from staging*"
          body=$(printf "Application code is live on \`main\` (prod) but NOT on \`staging\` — a hotfix that was never merged back (the #118 / #170-171 pattern that regenerates every-deploy conflicts).\n\nReconcile with a REAL MERGE, never squash/cherry-pick:%b%b\n\n<%s|Workflow run>" "$lines" "$ci_note" "${RUN_URL}")
          jq -n --arg h "$headline" --arg b "$body" '{
            text: $h,
            blocks: [
              { type: "section", text: { type: "mrkdwn", text: $h } },
              { type: "section", text: { type: "mrkdwn", text: $b } }
            ]
          }' > /tmp/slack.json
          curl -fsSL -X POST -H "Content-Type: application/json" -d @/tmp/slack.json "${SLACK_WEBHOOK}"

      - name: Summary
        if: steps.drift.outputs.code_drift == '0'
        run: |
          if [[ "${{ steps.drift.outputs.ci_drift }}" == "0" ]]; then
            echo "OK: every deployed repo's main has no content missing from staging."
          else
            echo "No CODE drift. ${{ steps.drift.outputs.ci_drift }} repo(s) have CI/docs-only drift (workflow files not back-merged) — see run log; not Slack-alarmed."
          fi
